<div
  *ngIf="open"
  class="modal-overlay"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="title"
  (click)="onBackdropClick($event)"
>
  <div class="modal-card" (click)="$event.stopPropagation()">
    <button type="button" class="close-btn" aria-label="Fechar modal" (click)="closeModal()">
      ×
    </button>

    <h4>{{ title }}</h4>

    <p *ngIf="description" class="description">{{ description }}</p>

    <ul *ngIf="items.length" class="details-list">
      <li *ngFor="let item of items">{{ item }}</li>
    </ul>

    <p *ngIf="footerNote" class="note">{{ footerNote }}</p>
  </div>
</div>
